# CCF — <repo>/.claude/integrated.conf
#
# Committed on `integrated-config`, the first input to every rebuild. Reaches
# upstream never: every PR branch is cut from upstream/main, so there is no path
# for this file onto one. Measured before relying on it —
#   git ls-tree ca-trust-guard .claude/   -> agent-name, github-app only
#   git reset --hard upstream/main        -> a conf committed on `integrated`
#                                            is DESTROYED, which is why it lives
#                                            on its own branch instead.

UPSTREAM_REPO=cnighswonger/claude-code-cache-fix
UPSTREAM_REMOTE=upstream
UPSTREAM_BRANCH=main
FORK_REMOTE=origin

INTEGRATED_BRANCH=integrated

PR_AUTHOR=codeslake

# The proxy prefix is load-bearing, not decoration: without it a test in
# test/proxy-server.test.mjs makes a real api.anthropic.com request and hangs on
# this network until it times out.
TEST_CMD='HTTPS_PROXY=http://127.0.0.1:8118 NO_PROXY=localhost,127.0.0.1,::1 npm test'

TEST_CAVEAT='EMFILE in test/proxy-server.test.mjs is fs.inotify.max_user_instances (128 on <linux-host>), not a regression — confirm it fails identically at the merge base before calling it ours'

# HOSTS ARE NOT TRACKED. This repo is public, and an ssh alias is exactly the
  # "SSH target" its information-hygiene rule bans. The real list lives in
  # .claude/hosts.local, which is untracked and per-clone:
  #     DEPLOY_HOSTS='<alias> <alias> <alias>'
  # Absent => empty, and the skill reports "no hosts configured" rather than
  # deploying somewhere nobody asked for. (Host details in internal deploy notes.)
  DEPLOY_HOSTS=''
  _ccf_hl="$(dirname "${BASH_SOURCE[0]:-$0}")/hosts.local"
  [ -r "$_ccf_hl" ] && . "$_ccf_hl"
  unset _ccf_hl

# CCF's dev clone and its deployed copy are DIFFERENT repositories, so status.sh
# cannot find the deployed one by re-anchoring this checkout's path. deploy.sh:7
# writes to `$HOME/.local/share/cache-fix-fork`; this names it.
#
# HOME-relative, and NO `$HOME` in the value: this file is sourced LOCALLY, so a
# `$HOME/...` string would bake in /home/j.lee8 and every mac would be asked
# about a path that does not exist there. status.sh anchors it inside the ssh.
#
# Measured with the key unset — one confident wrong answer, one blank:
#   <work-mac>  46bf13e (the dev clone, branch=local) vs integration ce1e9af
#   <personal-mac>     no repo at ~/workspace/claude-code-cache-fix
# both hosts were in fact exactly in sync at ce1e9af.
DEPLOY_REPO_REL='.local/share/cache-fix-fork'

POLL=300
